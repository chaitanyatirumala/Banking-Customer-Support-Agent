[project]
name = "enterprise-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chaitanyatirumala", email = "chaitanyatirumala04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.3.1",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langfuse>=5.0.4",
    "langgraph>=1.2.17",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
enterprise-support-agent = "enterprise_support_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
